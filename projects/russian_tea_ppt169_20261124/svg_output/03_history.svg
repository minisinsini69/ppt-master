<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Malgun Gothic, Segoe UI, sans-serif" data-pptx-page-role="content">
  <defs>
    <clipPath id="histFrame"><rect x="700" y="230" width="480" height="360" rx="16"/></clipPath>
  </defs>
  <image id="bg" data-pptx-role="background" href="../images/bg_content.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>

  <g id="header" data-pptx-bounds="210 70 850 136">
    <text x="214" y="170" font-family="Batang, Times New Roman, serif" font-size="104" font-weight="bold" fill="#C79A3B">01</text>
    <text x="352" y="158" font-family="Batang, Georgia, serif" font-size="56" font-weight="bold" fill="#8E1B24">러시아 차 문화의 역사</text>
    <line x1="354" y1="190" x2="454" y2="190" stroke="#C79A3B" stroke-width="2"/>
  </g>

  <g id="timeline" data-pptx-bounds="210 240 470 424">
    <line x1="232" y1="290" x2="232" y2="600" stroke="#C79A3B" stroke-width="2"/>
    <circle cx="232" cy="290" r="10" fill="#FBF6EC" stroke="#C79A3B" stroke-width="3"/>
    <circle cx="232" cy="440" r="14" fill="#8E1B24" stroke="#E8C873" stroke-width="3"/>
    <circle cx="232" cy="590" r="10" fill="#FBF6EC" stroke="#C79A3B" stroke-width="3"/>
    <text x="262" y="304" font-family="Batang, Georgia, serif" font-size="40" font-weight="bold" fill="#2B2220">중국 · 몽골</text>
    <text x="258" y="476" font-family="Batang, Times New Roman, serif" font-size="104" font-weight="bold" fill="#8E1B24">1638</text>
    <text x="262" y="526" font-size="32" fill="#2B2220">알틴 칸의 선물</text>
    <text x="262" y="604" font-family="Batang, Times New Roman, serif" font-size="40" font-weight="bold" fill="#2B2220">18–19세기</text>
    <text x="262" y="650" font-size="32" fill="#6E5E54">모두의 음료로</text>
  </g>

  <g id="history-picture" data-pptx-bounds="690 220 500 380">
    <image href="../images/p03_caravan.png" x="700" y="230" width="480" height="360" preserveAspectRatio="xMidYMid slice" clip-path="url(#histFrame)"/>
    <rect x="700" y="230" width="480" height="360" rx="16" fill="none" stroke="#C79A3B" stroke-width="2"/>
  </g>
</svg>
