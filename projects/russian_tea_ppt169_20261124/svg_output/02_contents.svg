      <circle cx="252" cy="256" r="26" fill="#8E1B24" stroke="#E8C873" stroke-width="2"/><text x="252" y="264">01</text>
      <circle cx="252" cy="340" r="26" fill="#8E1B24" stroke="#E8C873" stroke-width="2"/><text x="252" y="348">02</text>
      <circle cx="252" cy="424" r="26" fill="#8E1B24" stroke="#E8C873" stroke-width="2"/><text x="252" y="432">03</text>
      <circle cx="252" cy="508" r="26" fill="#8E1B24" stroke="#E8C873" stroke-width="2"/><text x="252" y="516">04</text>
      <circle cx="252" cy="592" r="26" fill="#8E1B24" stroke="#E8C873" stroke-width="2"/><text x="252" y="600">05</text>
