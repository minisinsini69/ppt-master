  <image id="bg" data-pptx-role="background" href="../images/bg_content.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>

  <g id="header" data-pptx-bounds="210 80 600 120">
    <text x="220" y="160" font-family="Batang, Georgia, serif" font-size="56" font-weight="bold" fill="#8E1B24">목차</text>
    <line x1="222" y1="190" x2="292" y2="190" stroke="#C79A3B" stroke-width="2"/>
    <circle cx="306" cy="190" r="5" fill="#C79A3B"/>
  </g>

